# docker-compose para usar en el NAS (sin build, descarga imagen de GitHub)
# Uso:
#   1. Copia este fichero + .env.example a tu NAS
#   2. cp .env.example .env && nano .env
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml exec app npx prisma db seed  (solo primera vez)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: porra_mundial
      POSTGRES_USER: porra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porra -d porra_mundial"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/mrpulete/porra-mundial:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://porra:${POSTGRES_PASSWORD}@db:5432/porra_mundial
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
